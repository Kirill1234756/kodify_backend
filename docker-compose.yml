version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: kodify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kodify_db}
      POSTGRES_USER: ${DB_USER:-kodify_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kodify_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kodify_network

  # Backend приложение
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodify_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_URLS: ${FRONTEND_URLS}
      
      # Database (используем имя сервиса из docker-compose)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kodify_db}
      DB_USER: ${DB_USER:-kodify_user}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # File Storage
      UPLOAD_DIR: ./uploads
      PUBLIC_URL: ${PUBLIC_URL}
      
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      
      # Bitrix24 (опционально)
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - kodify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  kodify_network:
    driver: bridge

